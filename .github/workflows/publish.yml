name: Publish Python Package

on:
  release:
    types: [published]

permissions:
  id-token: write
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    environment:
      name: pypi

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build package
        run: python -m build

      - name: Build matching Jentic plugin wheel
        run: python -m build --wheel --outdir plugin-dist integrations/jentic-one

      - name: Upload Jentic plugin wheel
        uses: actions/upload-artifact@v4
        with:
          name: barrikade-jentic-wheel
          path: plugin-dist/*.whl

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
