name: CI

# Lightweight CI for catching regressions that don't require model artifacts.
# Heavy end-to-end tests (tests/layer_*/test_layer_*.py) are intentionally excluded
# because they need the full GCS bundle pulled and take 20+ minutes on CPU.
# The PR author or reviewer is expected to run those locally when the change
# could plausibly affect runtime numerics.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Ruff lint + format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned Ruff
        run: python -m pip install ruff==0.15.14

      - name: Run Ruff lint
        run: ruff check .

      - name: Check Ruff formatting
        run: ruff format --check .

  install-runtime:
    name: Install runtime deps + smoke imports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.fast.txt

      - name: Install requirements.fast.txt
        # This is exactly what the production Docker image installs. If pip
        # can't resolve the pins together (e.g. a transformers version that
        # conflicts with optimum-onnx), this step fails and the rest of the
        # job short-circuits. Upgrade pip first to avoid resolver-version
        # quirks on GitHub-hosted runners (matches publish.yml's pattern).
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.fast.txt

      - name: Verify critical runtime imports
        # These are the import paths the runtime layer code actually uses.
        # The optimum.onnxruntime import is the canary that would have caught
        # the missing-optimum-onnx-dep regression from a previous PR. Add
        # to this list when a new dep enters the runtime hot path.
        env:
          PYTHONPATH: "."
        run: |
          python -c "import onnxruntime"
          python -c "from core.onnx_encoder import OnnxSentenceEncoder"

      - name: Smoke import of runtime modules
        # Catches AttributeErrors / import-time crashes in our own code.
        # Does not require model artifacts because we don't construct the
        # PIPipeline here (that would try to load files from disk).
        env:
          PYTHONPATH: "."
        run: |
          python -c "from core.settings import Settings; Settings()"
          python -c "from api.server import app"

      - name: Verify checked-in Jentic v2 client contract
        run: python integrations/jentic-one/scripts/check_openapi_contract.py

  test-fast:
    name: Fast tests (synthetic data, no artifacts needed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install requirements.txt (includes pytest)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run fast tests (unit and telemetry suites)
        # With the new revamped test organization, fast unit tests and telemetry
        # verification tests are isolated under tests/unit/ and tests/telemetry/.
        # Slow evaluation tests are isolated under tests/integration_eval/.
        # This completely eliminates the need for fragile file-based --ignore lists!
        env:
          PYTHONPATH: "."
        run: |
          pytest -q tests/unit/ tests/telemetry/

  docker-build:
    name: Production Docker image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build production image
        # Build only (don't push, don't run). This catches Dockerfile drift
        # and confirms requirements.fast.txt resolves inside the actual
        # python:3.12-slim build context. Pip's wheel resolution can differ
        # subtly between the host runner and the container build, so a
        # successful host install in install-runtime is necessary but not
        # sufficient.
        run: docker build --target production -t barrikada/api:ci .

      - name: Build Jentic 0.29.1 overlay image
        run: docker build -f deploy/jentic/overlay.Dockerfile -t barrikade/jentic-one:ci .

  jentic-plugin:
    name: Thin Jentic plugin wheel + compatibility tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: integrations/jentic-one/pyproject.toml

      - name: Build and install the thin wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install build pytest pytest-asyncio jentic-one==0.29.1
          python -m build --wheel --outdir /tmp/barrikade-jentic-dist integrations/jentic-one
          python -m pip install /tmp/barrikade-jentic-dist/barrikade_jentic-*.whl

      - name: Prove interpreter-start registration
        run: |
          python -c "from jentic_one.shared.config import registered_config_models; assert 'barrikade' in registered_config_models()"
          python -c "from jentic_one.registry.ingest import registered_pipeline_stage_specs; assert 'barrikade.specification' in {x.name for x in registered_pipeline_stage_specs()}"

      - name: Run plugin tests against Jentic 0.29.1
        env:
          PYTHONPATH: integrations/jentic-one/src
        run: pytest -q integrations/jentic-one/tests

  helm:
    name: Single-toggle Helm rendering
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Lint chart
        run: helm lint deploy/jentic

      - name: Verify disabled rendering is stock Jentic only
        run: |
          helm template test deploy/jentic --set barrikade.enabled=false > /tmp/disabled.yaml
          ! rg 'app.kubernetes.io/component: barrikade-core' /tmp/disabled.yaml
          ! rg 'JENTIC__BARRIKADE' /tmp/disabled.yaml
          rg 'ghcr.io/jentic/jentic-one-app@sha256:' /tmp/disabled.yaml

      - name: Verify enabled combined and parts rendering
        run: |
          helm template test deploy/jentic --set barrikade.enabled=true > /tmp/enabled.yaml
          rg 'app.kubernetes.io/component: barrikade-core' /tmp/enabled.yaml
          rg 'JENTIC__BARRIKADE__ENABLED' /tmp/enabled.yaml
          helm template test deploy/jentic --set barrikade.enabled=true --set jentic.mode=parts > /tmp/parts.yaml
          rg 'test-jentic-registry' /tmp/parts.yaml
          rg 'test-jentic-broker' /tmp/parts.yaml
