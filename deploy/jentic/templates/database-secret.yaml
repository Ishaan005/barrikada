{{- if and .Values.barrikade.enabled .Values.barrikade.database.internal.enabled (not .Values.barrikade.database.existingSecret) }}
{{- $name := include "barrikade-jentic.databaseSecret" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $password := randAlphaNum 48 -}}
{{- if and $existing (index $existing.data "password") -}}
{{- $password = (index $existing.data "password" | b64dec) -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "barrikade-jentic.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: barrikade
  password: {{ $password | quote }}
  database: barrikade
  url: {{ printf "postgresql://barrikade:%s@%s-postgresql:5432/barrikade" $password (include "barrikade-jentic.name" .) | quote }}
{{- end }}
