{{- $mode := .Values.jentic.mode -}}
{{- if not (has $mode (list "combined" "parts")) -}}
{{- fail "jentic.mode must be combined or parts" -}}
{{- end -}}
{{- $processes := list -}}
{{- if eq $mode "combined" -}}
{{- $processes = list (dict "name" "app" "apps" "registry,admin,control,auth") (dict "name" "broker" "apps" "broker") -}}
{{- else -}}
{{- $processes = list (dict "name" "registry" "apps" "registry") (dict "name" "admin" "apps" "admin,auth") (dict "name" "control" "apps" "control") (dict "name" "broker" "apps" "broker") -}}
{{- end -}}
{{- range $index, $process := $processes }}
{{- if $index }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Release.Name }}-jentic-{{ $process.name }}
  labels:
    {{- include "barrikade-jentic.labels" $ | nindent 4 }}
    app.kubernetes.io/name: jentic-{{ $process.name }}
spec:
  replicas: {{ $.Values.jentic.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $.Release.Name }}
      app.kubernetes.io/name: jentic-{{ $process.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ $.Release.Name }}
        app.kubernetes.io/name: jentic-{{ $process.name }}
        barrikade.io/protected: {{ $.Values.barrikade.enabled | quote }}
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: jentic
          image: {{ include "barrikade-jentic.jenticImage" $ | quote }}
          imagePullPolicy: {{ ternary $.Values.jentic.barrikadeImage.pullPolicy $.Values.jentic.stockImage.pullPolicy $.Values.barrikade.enabled }}
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: JENTIC__APPS
              value: {{ $process.apps | quote }}
            {{- if $.Values.barrikade.enabled }}
            - name: JENTIC__BARRIKADE__ENABLED
              value: "true"
            - name: JENTIC__BARRIKADE__ENDPOINT
              value: {{ printf "http://%s-core:%v" (include "barrikade-jentic.name" $) $.Values.barrikade.service.port | quote }}
            - name: JENTIC__BARRIKADE__TOKEN_FILE
              value: /var/run/secrets/barrikade/token
            - name: JENTIC__BARRIKADE__REQUEST_TIMEOUT_SECONDS
              value: {{ $.Values.barrikade.timeoutSeconds | quote }}
            - name: JENTIC__BARRIKADE__MAX_TEXT_BYTES
              value: {{ $.Values.barrikade.maxTextBytes | quote }}
            - name: JENTIC__BARRIKADE__EVENT_QUEUE_SIZE
              value: {{ $.Values.barrikade.eventQueueSize | quote }}
            {{- end }}
            {{- range $key, $value := $.Values.jentic.extraEnv }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- if $.Values.jentic.config.existingSecret }}
            - name: JENTIC_CONFIG_FILE
              value: /etc/jentic/{{ $.Values.jentic.config.key }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
          resources:
            {{- toYaml $.Values.jentic.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          {{- if or $.Values.barrikade.enabled $.Values.jentic.config.existingSecret }}
          volumeMounts:
            {{- if $.Values.barrikade.enabled }}
            - name: barrikade-token
              mountPath: /var/run/secrets/barrikade
              readOnly: true
            {{- end }}
            {{- if $.Values.jentic.config.existingSecret }}
            - name: jentic-config
              mountPath: /etc/jentic
              readOnly: true
            {{- end }}
          {{- end }}
      {{- if or $.Values.barrikade.enabled $.Values.jentic.config.existingSecret }}
      volumes:
        {{- if $.Values.barrikade.enabled }}
        - name: barrikade-token
          secret:
            secretName: {{ include "barrikade-jentic.tokenSecret" $ }}
            items:
              - key: token
                path: token
        {{- end }}
        {{- if $.Values.jentic.config.existingSecret }}
        - name: jentic-config
          secret:
            secretName: {{ $.Values.jentic.config.existingSecret }}
        {{- end }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $.Release.Name }}-jentic-{{ $process.name }}
  labels:
    {{- include "barrikade-jentic.labels" $ | nindent 4 }}
    app.kubernetes.io/name: jentic-{{ $process.name }}
spec:
  selector:
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/name: jentic-{{ $process.name }}
  ports:
    - name: http
      port: 8000
      targetPort: http
{{- end }}
