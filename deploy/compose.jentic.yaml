# Add this overlay to an existing Jentic Compose deployment. The sole public switch is:
# JENTIC__BARRIKADE__ENABLED=true
services:
  jentic-app:
    image: ${BARRIKADE_JENTIC_IMAGE:-ghcr.io/barrikade/jentic-one:0.2.0}
    environment:
      JENTIC__BARRIKADE__ENABLED: ${JENTIC__BARRIKADE__ENABLED:-false}
      JENTIC__BARRIKADE__ENDPOINT: http://barrikade-core:8000
      JENTIC__BARRIKADE__TOKEN_FILE: /run/secrets/barrikade/token
    volumes:
      - barrikade_service_token:/run/secrets/barrikade:ro
    depends_on:
      barrikade-init:
        condition: service_completed_successfully

  jentic-broker:
    image: ${BARRIKADE_JENTIC_IMAGE:-ghcr.io/barrikade/jentic-one:0.2.0}
    environment:
      JENTIC__APPS: broker
      JENTIC__BARRIKADE__ENABLED: ${JENTIC__BARRIKADE__ENABLED:-false}
      JENTIC__BARRIKADE__ENDPOINT: http://barrikade-core:8000
      JENTIC__BARRIKADE__TOKEN_FILE: /run/secrets/barrikade/token
    volumes:
      - barrikade_service_token:/run/secrets/barrikade:ro
    depends_on:
      barrikade-init:
        condition: service_completed_successfully

  barrikade-init:
    image: python:3.12-alpine
    restart: "no"
    environment:
      JENTIC__BARRIKADE__ENABLED: ${JENTIC__BARRIKADE__ENABLED:-false}
    command:
      - python
      - -c
      - |
        import json, os, pathlib, secrets
        root = pathlib.Path('/secrets')
        root.mkdir(parents=True, exist_ok=True)
        token_path = root / 'token'
        token = token_path.read_text().strip() if token_path.exists() else secrets.token_urlsafe(48)
        token_path.write_text(token)
        (root / 'tokens.json').write_text(json.dumps({'tokens': [{'token': token, 'principal_id': 'jentic-compose', 'scopes': ['assessments:write', 'assessments:read', 'overrides:write']}]}))
        os.chmod(token_path, 0o444)
        os.chmod(root / 'tokens.json', 0o444)
    volumes:
      - barrikade_service_token:/secrets

  barrikade-core:
    image: ${BARRIKADE_CORE_IMAGE:-ghcr.io/barrikade/core:0.2.0}
    restart: on-failure
    command: ["python", "-m", "barrikade.service.compose"]
    environment:
      JENTIC__BARRIKADE__ENABLED: ${JENTIC__BARRIKADE__ENABLED:-false}
      BARRIKADE_SERVICE_TOKEN_FILE: /run/secrets/barrikade/tokens.json
      BARRIKADE_DATABASE_URL: sqlite:////var/lib/barrikade/metadata.db
      BARRIKADE_AUTO_MIGRATE: "true"
      BARRIKADE_ACTIVE_PROFILE: jentic_gateway_fast
    volumes:
      - barrikade_service_token:/run/secrets/barrikade:ro
      - barrikade_metadata:/var/lib/barrikade
    depends_on:
      barrikade-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 24

volumes:
  barrikade_service_token:
  barrikade_metadata:
