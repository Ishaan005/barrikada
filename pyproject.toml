[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "barrikade"
dynamic = ["version"]
description = "Runtime prompt-injection detection for AI agents."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Barrikade" }
]
dependencies = [
  "chardet==5.2.0",
  "confusable-homoglyphs>=3.3.1",
  "cryptography>=44.0.0",
  "faiss-cpu>=1.13.0",
  "fastapi>=0.115.0,<1.0",
  "ftfy>=6.3.1",
  "joblib>=1.5.0",
  "numpy>=2.3.0",
  "onnxruntime>=1.22.0",
  "psycopg[binary]>=3.2.0",
  "pydantic>=2.12.0",
  "scikit-learn>=1.7.0",
  "transformers>=4.57.6,<6",
  "uvicorn>=0.38.0",
]
keywords = ["ai", "llm", "security", "prompt-injection", "agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/barrikade-ai/barrikade"
Repository = "https://github.com/barrikade-ai/barrikade"
Issues = "https://github.com/barrikade-ai/barrikade/issues"

[project.scripts]
barrikade = "barrikade.__main__:main"
barrikade-migrate = "barrikade.service.migrate:main"

[project.optional-dependencies]
layer-e = [
  "sentence-transformers>=5.3.0",
  "torch>=2.12.1",
]
artifact-download = [
  "google-cloud-storage>=2.10.0",
  "requests>=2.32.0",
  "tqdm>=4.67.0",
]
training = [
  "datasets>=4.4.0",
  "onnx>=1.22.0",
  "onnxmltools>=1.16.0",
  "pandas>=2.3.0",
  "sentence-transformers>=5.3.0",
  "torch>=2.12.1",
  "xgboost>=3.1.0",
]
dev = [
  "pytest>=9.0.0",
  "pytest-cov>=7.0.0",
  "ruff==0.15.14",
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["api", "barrikade", "barrikade.*", "core", "core.*", "models", "models.*"]
exclude = ["tests", "tests.*", "docs", "docs.*", "examples", "examples.*", "demos", "demos.*"]

[tool.pytest.ini_options]
# Adds the repo root to sys.path during pytest discovery so tests can
# `from core.X import ...` without needing `PYTHONPATH=.` set externally.
# tests/conftest.py notes the assumption; this makes it actually true.
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "telemetry: mark tests relating to centralized observability telemetry",
    "slow: mark tests that are slow integration or dataset-driven evaluation tests",
]

[tool.setuptools.dynamic]
version = {attr = "core.__version__.__version__"}

[tool.ruff]
required-version = "==0.15.14"
target-version = "py312"
line-length = 100
exclude = [
    ".git",
    ".pytest_cache",
    ".venv",
    "venv",
    "build",
    "dist",
    "__pycache__",
    "notebooks",
]

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "PLC0415",
    "PLC2701",
    "UP006",
    "UP007",
    "UP035",
    "UP045",
]
preview = true
explicit-preview-rules = true

[tool.ruff.lint.isort]
lines-after-imports = 2

[tool.bandit]
exclude_dirs = ["tests", "venv"]
