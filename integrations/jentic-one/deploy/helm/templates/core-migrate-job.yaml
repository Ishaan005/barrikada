{{- if .Values.barrikade.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "barrikade-jentic.name" . }}-migrate-{{ .Release.Revision }}
  labels:
    {{- include "barrikade-jentic.labels" . | nindent 4 }}
    app.kubernetes.io/component: barrikade-migration
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: barrikade-migration
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: {{ include "barrikade-jentic.coreImage" . | quote }}
          imagePullPolicy: {{ .Values.barrikade.image.pullPolicy }}
          command: ["python", "-m", "barrikade.service.migrate"]
          env:
            - name: BARRIKADE_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "barrikade-jentic.databaseSecret" . }}
                  key: url
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
{{- end }}
