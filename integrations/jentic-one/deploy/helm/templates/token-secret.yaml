{{- if and .Values.barrikade.enabled (not .Values.barrikade.token.existingSecret) }}
{{- $name := include "barrikade-jentic.tokenSecret" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $token := randAlphaNum 64 -}}
{{- if and $existing (index $existing.data "token") -}}
{{- $token = (index $existing.data "token" | b64dec) -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "barrikade-jentic.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ $token | quote }}
  tokens.json: {{ dict "tokens" (list (dict "token" $token "principal_id" "jentic" "scopes" (list "assessments:write" "assessments:read" "overrides:write"))) | toJson | quote }}
{{- end }}
