services:
  barrikade-api:
    image: ${BARRIKADE_CORE_IMAGE:-ghcr.io/barrikade/core:0.2.0}
    container_name: barrikade-api
    environment:
      BARRIKADE_SERVICE_TOKEN: ${BARRIKADE_SERVICE_TOKEN:-local-development-token}
      BARRIKADE_DATABASE_URL: sqlite:////var/lib/barrikade/metadata.db
      BARRIKADE_AUTO_MIGRATE: "true"
    ports:
      - "8000:8000"
    volumes:
      - barrikade_metadata:/var/lib/barrikade

volumes:
  barrikade_metadata:
